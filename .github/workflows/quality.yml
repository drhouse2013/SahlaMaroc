name: Qualité du site
on:
  push:
    branches: [main, 'design/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Reuse optimized images
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-${{ hashFiles('src/assets/**', 'public/**') }}
          restore-keys: |
            astro-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-
      - run: npm run test:unit
      - run: npm run check:content
      - run: npm run build
      - run: npm run check:dist
      - run: npm audit --omit=dev --audit-level=high
