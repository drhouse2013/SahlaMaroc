name: Sauvegarde GitHub de main

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-main-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Créer un tag de sauvegarde
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          short_sha="${GITHUB_SHA:0:12}"
          tag="backup/main-${stamp}-${short_sha}-${GITHUB_RUN_ID}"
          git tag -a "$tag" "$GITHUB_SHA" -m "Sauvegarde automatique de main à ${GITHUB_SHA}"
          git push origin "refs/tags/$tag"
